name: Daily Instagram Post

on:
  # schedule:
  #   # 3:30 UTC = 9:00 AM IST (India Standard Time)
  #   - cron: "30 3 * * *"
  workflow_dispatch: # allows manual trigger from GitHub UI

permissions:
  contents: write  # needed to commit tracker.json back to the repo

jobs:
  generate-post:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # fail fast if something hangs (default is 6 hours)

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"  # caches pip packages between runs

      - name: Cache static ffmpeg binary
        uses: actions/cache@v4
        id: cache-ffmpeg
        with:
          path: /usr/local/bin/ffmpeg
          key: ffmpeg-static-linux64-v1

      - name: Install static ffmpeg binary
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: |
          wget -q https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
          tar -xf ffmpeg-release-amd64-static.tar.xz
          sudo mv ffmpeg-*-amd64-static/ffmpeg /usr/local/bin/ffmpeg
          ffmpeg -version | head -1

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download background music
        # Downloads a royalty-free lofi track into assets/music.mp3
        # Set MUSIC_URL as a GitHub secret to use your own track (any direct MP3 link)
        # If the secret is not set, the video will be generated without music
        if: ${{ secrets.MUSIC_URL != '' }}
        run: |
          mkdir -p assets
          wget -q -O assets/music.mp3 "${{ secrets.MUSIC_URL }}" && echo "Music downloaded." || echo "Music download failed — continuing without music."

      - name: Run post generator
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          CAFE_NAME: ${{ secrets.CAFE_NAME }}
        run: python post_generator.py

      # Commit tracker.json and logs back so tomorrow knows which item comes next
      - name: Save tracker and logs to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tracker.json logs/
          git diff --staged --quiet || git commit -m "chore: advance menu tracker and save run log [skip ci]"
          git pull --rebase origin main
          git push
