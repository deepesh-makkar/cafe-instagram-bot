name: Daily Instagram Post

on:
  # schedule:
  #   # 3:30 UTC = 9:00 AM IST (India Standard Time)
  #   - cron: "30 3 * * *"
  workflow_dispatch: # allows manual trigger from GitHub UI

permissions:
  contents: write  # needed to commit tracker.json back to the repo

jobs:
  generate-post:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # fail fast if something hangs (default is 6 hours)

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"  # caches pip packages between runs

      - name: Install ffmpeg
        # apt-get ffmpeg includes all filters (drawtext, gblur, etc.)
        # The old static binary from johnvansickle.com was missing these
        run: |
          sudo apt-get update
          sudo apt-get install -y --fix-missing ffmpeg
          ffmpeg -version | head -1

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run post generator
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          CAFE_NAME: ${{ secrets.CAFE_NAME }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python post_generator.py

      # Commit tracker.json and logs back so tomorrow knows which item comes next
      - name: Save tracker and logs to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tracker.json logs/
          git diff --staged --quiet || git commit -m "chore: advance menu tracker and save run log [skip ci]"
          git pull --rebase origin main
          git push
