name: Daily Instagram Post

on:
  schedule:
    # 3:30 UTC = 9:00 AM IST (India Standard Time)
    - cron: "30 3 * * *"
  workflow_dispatch: # allows manual trigger from GitHub UI

jobs:
  generate-post:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run post generator
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          CAFE_NAME: ${{ secrets.CAFE_NAME }}
        run: python post_generator.py

      # Commit tracker.json back so tomorrow knows which item comes next
      - name: Save tracker to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tracker.json
          git diff --staged --quiet || git commit -m "chore: advance menu tracker [skip ci]"
          git push
