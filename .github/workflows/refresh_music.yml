name: Refresh Trending Music

on:
  schedule:
    # Runs every other Monday at 8:00 UTC (1:30 PM IST) — biweekly music refresh
    - cron: "0 8 1,15 * *"
  workflow_dispatch: # manual trigger for testing

permissions:
  contents: write

jobs:
  refresh-music:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install anthropic requests python-dotenv

      - name: Find trending music and update MUSIC_URL secret
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_REPO: deepesh-makkar/cafe-instagram-bot
        run: python refresh_music.py
